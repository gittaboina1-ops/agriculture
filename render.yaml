services:
  # Frontend React/Vite SPA deployed on Render
  - type: web
    name: agriculture-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    
    # Environment variables for the build
    envVars:
      - key: VITE_API_URL
        value: https://brain-trails-injection-analog.trycloudflare.com/api
    
    # SPA rewrite rule: all routes serve index.html
    routes:
      - source: "/*"
        destination: "/index.html"
        action: "rewrite"

# IMPORTANT DEPLOYMENT ARCHITECTURE:
# This repository uses a LOCAL FastAPI backend via Cloudflare Tunnel.
# 
# The backend is NOT deployed as a Render service.
# 
# Instead:
# 1. Local backend runs: python -m uvicorn backend.main:app --host 0.0.0.0 --port 8000
# 2. Cloudflare Tunnel exposes it at: https://brain-trails-injection-analog.trycloudflare.com
# 3. Frontend on Render calls: https://brain-trails-injection-analog.trycloudflare.com/api
# 
# If the Cloudflare Tunnel URL changes or the backend is moved, update VITE_API_URL above.
